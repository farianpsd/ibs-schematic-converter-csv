<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBS Link Budget AI Extractor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 10px; }
        .chat-container { width: 100%; max-width: 850px; height: 95vh; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #0d6efd; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { font-size: 1.1rem; font-weight: 600; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background-color: #f8f9fa; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; flex-direction: column; max-width: 85%; line-height: 1.4; font-size: 0.95rem; }
        .message.user { align-self: flex-end; background-color: #0d6efd; color: white; border-radius: 15px 15px 0 15px; padding: 10px 15px; }
        .message.bot { align-self: flex-start; background-color: #ffffff; color: #333; border: 1px solid #e0e0e0; border-radius: 15px 15px 15px 0; padding: 12px 15px; width: 100%; }
        
        /* Grid gambar di bubble chat user */
        .user-img-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .img-preview-msg { max-width: 180px; max-height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); }
        
        .chat-input-area { padding: 15px; background: #ffffff; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; }
        
        /* Multi-Preview Bar */
        .preview-bar { display: none; align-items: center; gap: 10px; background: #e9ecef; padding: 8px 12px; border-radius: 6px; overflow-x: auto; }
        .preview-list { display: flex; gap: 10px; align-items: center; flex: 1; }
        .preview-item { position: relative; display: inline-block; }
        .preview-item img { height: 50px; border-radius: 4px; border: 1px solid #ced4da; display: block; }
        .preview-item .remove-single { position: absolute; top: -6px; right: -6px; background: #dc3545; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .clear-all-btn { color: #dc3545; cursor: pointer; font-size: 0.85rem; font-weight: bold; white-space: nowrap; margin-left: 10px; }

        .input-row { display: flex; gap: 10px; }
        .input-row input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #ced4da; border-radius: 8px; outline: none; }
        .input-row input[type="text"]:focus { border-color: #0d6efd; }
        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; white-space: nowrap; }
        .btn-primary { background: #0d6efd; color: white; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5c636a; }
        .btn-success { background: #198754; color: white; margin-top: 10px; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; }
        .btn-success:hover { background: #157347; }
        pre { background: #272822; color: #f8f8f2; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.82rem; margin-top: 8px; max-height: 300px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>IBS Link Budget AI Extractor</h2>
        <span style="font-size: 0.8rem; opacity: 0.85;">Multi-Schematic Mode • Gemini 2.5 Pro</span>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Halo! Silakan <b>Paste (Ctrl+V)</b> berkali-kali atau <b>Pilih Beberapa Gambar</b> skematik IBS yang terhubung dalam satu sistem Repeater ke kolom input di bawah ini.
        </div>
    </div>

    <div class="chat-input-area">
        <div class="preview-bar" id="previewBar">
            <div class="preview-list" id="previewList"></div>
            <span class="clear-all-btn" onclick="clearAllImages()">Hapus Semua</span>
        </div>
        <div class="input-row">
            <!-- Atribut 'multiple' diaktifkan -->
            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" onchange="handleFileSelect(event)">
            <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Pilih Gambar</button>
            
            <!-- Text Input -->
            <input type="text" id="userInput" placeholder="Tempel gambar (Ctrl+V) atau ketik catatan..." onpaste="handlePaste(event)" onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn btn-primary" onclick="sendMessage()">Kirim</button>
        </div>
    </div>
</div>

<script>
    // Array untuk menyimpan banyak objek File sekaligus
    let selectedFiles = [];

    // Handle Paste (Ctrl+V) berulang kali
    function handlePaste(e) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        let hasImage = false;
        for (let item of items) {
            if (item.type.indexOf('image') !== -1) {
                const file = item.getAsFile();
                if (file) {
                    selectedFiles.push(file);
                    hasImage = true;
                }
            }
        }
        if (hasImage) {
            renderPreviews();
        }
    }

    // Handle File Selection dari Tombol (bisa pilih banyak sekaligus)
    function handleFileSelect(e) {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
            selectedFiles = selectedFiles.concat(files);
            renderPreviews();
        }
        // Reset input agar file yang sama bisa dipilih ulang jika perlu
        e.target.value = '';
    }

    // Render thumbnail semua gambar yang siap dikirim
    function renderPreviews() {
        const previewBar = document.getElementById('previewBar');
        const previewList = document.getElementById('previewList');
        previewList.innerHTML = '';

        if (selectedFiles.length === 0) {
            previewBar.style.display = 'none';
            return;
        }

        previewBar.style.display = 'flex';
        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'preview-item';
                itemDiv.innerHTML = `
                    <img src="${event.target.result}" title="${file.name || 'Pasted Image ' + (index + 1)}">
                    <span class="remove-single" onclick="removeSingleImage(${index})" title="Hapus gambar ini">✕</span>
                `;
                previewList.appendChild(itemDiv);
            };
            reader.readAsDataURL(file);
        });
    }

    function removeSingleImage(index) {
        selectedFiles.splice(index, 1);
        renderPreviews();
    }

    function clearAllImages() {
        selectedFiles = [];
        document.getElementById('previewBar').style.display = 'none';
        document.getElementById('previewList').innerHTML = '';
        document.getElementById('fileInput').value = '';
    }

    // Fungsi Helper: Mengubah Array of Objects dari app.py menjadi 1 string CSV
    function convertToCSV(dataArray) {
        if (!dataArray || dataArray.length === 0) return '';
        const headers = Object.keys(dataArray[0]);
        const csvRows = [headers.join(',')];

        for (const row of dataArray) {
            const values = headers.map(header => {
                const val = row[header] !== null && row[header] !== undefined ? String(row[header]) : '';
                return `"${val.replace(/"/g, '""')}"`;
            });
            csvRows.push(values.join(','));
        }
        return csvRows.join('\n');
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();

        if (!text && selectedFiles.length === 0) return;

        const chatBox = document.getElementById('chatBox');

        // 1. Tampilkan Pesan & Semua Gambar User di Chat
        const userMsgDiv = document.createElement('div');
        userMsgDiv.className = 'message user';

        if (selectedFiles.length > 0) {
            const imgGrid = document.createElement('div');
            imgGrid.className = 'user-img-grid';
            selectedFiles.forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.className = 'img-preview-msg';
                imgGrid.appendChild(img);
            });
            userMsgDiv.appendChild(imgGrid);
        }

        if (text) {
            const txtSpan = document.createElement('span');
            txtSpan.innerText = text;
            userMsgDiv.appendChild(txtSpan);
        } else if (selectedFiles.length > 0) {
            const txtSpan = document.createElement('span');
            txtSpan.innerText = `Mengekstrak ${selectedFiles.length} gambar skematik...`;
            userMsgDiv.appendChild(txtSpan);
        }
        chatBox.appendChild(userMsgDiv);

        // 2. Siapkan FormData untuk dikirim ke /chat di app.py
        const formData = new FormData();
        selectedFiles.forEach(file => {
            formData.append('files', file); // Sesuai dengan request.files.getlist('files') di app.py
        });
        formData.append('message', text);

        // Reset Input Bar
        input.value = '';
        clearAllImages();
        chatBox.scrollTop = chatBox.scrollHeight;

        // 3. Loading Indicator Bot
        const botLoadingDiv = document.createElement('div');
        botLoadingDiv.className = 'message bot';
        botLoadingDiv.innerText = 'Sedang melacak jalur & menghitung loss dari semua skematik... (Mohon tunggu ±15-30 detik)';
        chatBox.appendChild(botLoadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            if (result.success && result.data) {
                const csvData = convertToCSV(result.data);

                botLoadingDiv.innerHTML = `
                    <b>✅ Berhasil mengekstrak ${result.count} titik antena menjadi 1 file CSV:</b>
                    <pre>${escapeHtml(csvData)}</pre>
                `;

                // Tambah tombol download 1 file CSV gabungan
                const downloadBtn = document.createElement('a');
                downloadBtn.className = 'btn-success';
                downloadBtn.innerHTML = `📥 Download CSV Gabungan (${result.count} Node)`;
                downloadBtn.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvData);
                downloadBtn.download = 'ibs_combined_link_budget.csv';
                botLoadingDiv.appendChild(downloadBtn);

            } else if (result.response) {
                botLoadingDiv.innerHTML = escapeHtml(result.response);
            } else {
                botLoadingDiv.innerHTML = `<span style="color:red;">Error: ${escapeHtml(result.error || 'Gagal memproses gambar.')}</span>`;
            }
        } catch (err) {
            botLoadingDiv.innerHTML = `<span style="color:red;">Terjadi kesalahan koneksi atau timeout server: ${escapeHtml(err.message)}</span>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
