<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBS Link Budget AI Extractor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 10px; }
        .chat-container { width: 100%; max-width: 900px; height: 95vh; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #0d6efd; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { font-size: 1.1rem; font-weight: 600; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background-color: #f8f9fa; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; flex-direction: column; max-width: 90%; line-height: 1.4; font-size: 0.95rem; }
        .message.user { align-self: flex-end; background-color: #0d6efd; color: white; border-radius: 15px 15px 0 15px; padding: 10px 15px; }
        .message.bot { align-self: flex-start; background-color: #ffffff; color: #333; border: 1px solid #e0e0e0; border-radius: 15px 15px 15px 0; padding: 14px 16px; width: 100%; }
        
        /* Grid gambar di bubble chat user */
        .user-img-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .img-preview-msg { max-width: 180px; max-height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); }
        
        .chat-input-area { padding: 15px; background: #ffffff; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; }
        
        /* Multi-Preview Bar */
        .preview-bar { display: none; align-items: center; gap: 10px; background: #e9ecef; padding: 8px 12px; border-radius: 6px; overflow-x: auto; }
        .preview-list { display: flex; gap: 10px; align-items: center; flex: 1; }
        .preview-item { position: relative; display: inline-block; }
        .preview-item img { height: 50px; border-radius: 4px; border: 1px solid #ced4da; display: block; }
        .preview-item .remove-single { position: absolute; top: -6px; right: -6px; background: #dc3545; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .clear-all-btn { color: #dc3545; cursor: pointer; font-size: 0.85rem; font-weight: bold; white-space: nowrap; margin-left: 10px; }

        .input-row { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: 0.2s; white-space: nowrap; }
        .btn-primary { background: #0d6efd; color: white; flex: 1; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-primary:disabled { background: #8bb9fe; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; color: white; flex: 1; }
        .btn-secondary:hover { background: #5c636a; }
        .btn-success { background: #198754; color: white; margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; padding: 10px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; width: fit-content; cursor: pointer; border: none; }
        .btn-success:hover { background: #157347; }
        pre { background: #272822; color: #f8f8f2; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.82rem; margin-top: 10px; max-height: 320px; white-space: pre; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>IBS Link Budget AI Extractor</h2>
        <span style="font-size: 0.8rem; opacity: 0.85;">Multi-Schematic Mode • High Precision</span>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Halo! Silakan klik <b>Pilih Gambar</b> untuk memilih 1 atau beberapa gambar skematik IBS yang terhubung dalam satu sistem Repeater, lalu klik <b>Proses</b>.
        </div>
    </div>

    <div class="chat-input-area">
        <div class="preview-bar" id="previewBar">
            <div class="preview-list" id="previewList"></div>
            <span class="clear-all-btn" onclick="clearAllImages()">Hapus Semua</span>
        </div>
        <div class="input-row">
            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" onchange="handleFileSelect(event)">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Pilih Gambar</button>
            <button type="button" id="processBtn" class="btn btn-primary" onclick="sendMessage()">Proses</button>
        </div>
    </div>
</div>

<script>
    let selectedFiles = [];

    function handleFileSelect(e) {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
            selectedFiles = selectedFiles.concat(files);
            renderPreviews();
        }
        e.target.value = '';
    }

    function renderPreviews() {
        const previewBar = document.getElementById('previewBar');
        const previewList = document.getElementById('previewList');
        previewList.innerHTML = '';

        if (selectedFiles.length === 0) {
            previewBar.style.display = 'none';
            return;
        }

        previewBar.style.display = 'flex';
        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'preview-item';
                itemDiv.innerHTML = `
                    <img src="${event.target.result}" title="${file.name || 'Gambar ' + (index + 1)}">
                    <span class="remove-single" onclick="removeSingleImage(${index})" title="Hapus gambar ini">✕</span>
                `;
                previewList.appendChild(itemDiv);
            };
            reader.readAsDataURL(file);
        });
    }

    function removeSingleImage(index) {
        selectedFiles.splice(index, 1);
        renderPreviews();
    }

    function clearAllImages() {
        selectedFiles = [];
        document.getElementById('previewBar').style.display = 'none';
        document.getElementById('previewList').innerHTML = '';
        document.getElementById('fileInput').value = '';
    }

    function downloadCSVFile(csvContent, filename) {
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    async function pollJobUntilDone(jobId, statusElement, chatBox) {
        while (true) {
            const res = await fetch(`/api/job/${jobId}?t=${Date.now()}`, { cache: 'no-store' });
            const rawText = await res.text();
            let data;
            try {
                data = JSON.parse(rawText);
            } catch (e) {
                throw new Error(`HTTP ${res.status} (Non-JSON): ${rawText.replace(/<[^>]*>/g, ' ').trim().slice(0, 140)}`);
            }

            if (data.status === 'processing') {
                if (statusElement && data.step) {
                    statusElement.innerText = `⏳ ${data.step}`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
                await new Promise(resolve => setTimeout(resolve, 1500));
                continue;
            }
            return data;
        }
    }

    async function sendMessage() {
        if (selectedFiles.length === 0) {
            alert('Silakan pilih minimal 1 gambar skematik IBS terlebih dahulu.');
            return;
        }

        const chatBox = document.getElementById('chatBox');
        const processBtn = document.getElementById('processBtn');
        processBtn.disabled = true;
        processBtn.innerText = 'Memproses...';

        // 1. Tampilkan Semua Gambar User di Chat
        const userMsgDiv = document.createElement('div');
        userMsgDiv.className = 'message user';

        const imgGrid = document.createElement('div');
        imgGrid.className = 'user-img-grid';
        selectedFiles.forEach(file => {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.className = 'img-preview-msg';
            imgGrid.appendChild(img);
        });
        userMsgDiv.appendChild(imgGrid);

        const txtSpan = document.createElement('span');
        txtSpan.innerText = `Memproses ${selectedFiles.length} gambar skematik...`;
        userMsgDiv.appendChild(txtSpan);
        chatBox.appendChild(userMsgDiv);

        // 2. Siapkan FormData untuk dikirim ke /chat di app.py
        const formData = new FormData();
        selectedFiles.forEach(file => {
            formData.append('files', file);
        });
        formData.append('message', '');

        // Reset Preview Bar
        clearAllImages();
        chatBox.scrollTop = chatBox.scrollHeight;

        // 3. Loading Indicator Bot
        const botLoadingDiv = document.createElement('div');
        botLoadingDiv.className = 'message bot';
        botLoadingDiv.innerText = '⏳ Mengunggah skematik & menyiapkan analisis presisi tinggi...';
        chatBox.appendChild(botLoadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                body: formData
            });

            const rawInitText = await response.text();
            let result;
            try {
                result = JSON.parse(rawInitText);
            } catch (e) {
                throw new Error(`HTTP ${response.status} (Non-JSON): ${rawInitText.replace(/<[^>]*>/g, ' ').trim().slice(0, 140)}`);
            }

            // Jika server mengembalikan job_id (mode bertahap anti-timeout), lanjutkan polling
            if (result.status === 'processing' && result.job_id) {
                result = await pollJobUntilDone(result.job_id, botLoadingDiv, chatBox);
            }

            if (result.status === 'success' && result.csv) {
                const csvData = result.csv.trim();
                const lines = csvData.split('\n').filter(line => line.trim() !== '');
                const rowCount = Math.max(0, lines.length - 1);

                botLoadingDiv.innerHTML = `
                    <b>✅ Berhasil mengekstrak ${rowCount} titik antena dari ${result.image_count || 1} skematik menjadi 1 file CSV:</b>
                    <pre>${escapeHtml(csvData)}</pre>
                `;

                const downloadBtn = document.createElement('button');
                downloadBtn.type = 'button';
                downloadBtn.className = 'btn-success';
                downloadBtn.innerHTML = `📥 Download CSV Gabungan (${rowCount} Baris)`;
                downloadBtn.onclick = () => downloadCSVFile(csvData, 'ibs_combined_link_budget.csv');
                botLoadingDiv.appendChild(downloadBtn);

            } else {
                const errText = result.message || result.response || result.error || 'Gagal memproses gambar.';
                botLoadingDiv.innerHTML = `<span style="color:#dc3545; font-weight:600;">❌ ${escapeHtml(errText)}</span>`;
            }
        } catch (err) {
            botLoadingDiv.innerHTML = `<span style="color:#dc3545; font-weight:600;">❌ Terjadi kesalahan: ${escapeHtml(err.message)}</span>`;
        } finally {
            processBtn.disabled = false;
            processBtn.innerText = 'Proses';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function escapeHtml(text) {
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
